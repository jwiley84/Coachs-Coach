{% extends "admin_base.html" %}
{% block title %}Admin Portal{% endblock %}

{% block admin_content %}

  <div class="card border-dark mb-3 mx-2 initials-card admin-card">
        <div class="card-body">
          <table>
            <tr>
              <th>Initials</th>
            </tr>
            {% for initials in roster %}
              <tr>
                <td>{{initials}}</td>
              </tr>
            {% endfor %}
          </table>
        </div>
    </div>
    <form action="{{ url_for('admin_roster') }}" method="POST">
        <input type="submit" name="operation" value="add">
        <input type="submit" name="operation" value="remove">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    </form>

{% endblock %}
