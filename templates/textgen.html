{% extends "base.html" %}

{% block title %} Attendance String {% endblock %}

{% block content %}
    <div id="div1">
        <div id="textToCopy">{{ str_render }}</div>
        <button onclick="copyText()">Copy</button><br>
        <button><a href="{{ url_for('text_form') }}">Start Over</a></button>

        <script>
            async function copyText() {
                try {
                const text = document.getElementById("textToCopy").textContent;

                // Write text to clipboard (modern API)
                await navigator.clipboard.writeText(text);

                } catch (err) {
                console.error("Failed to copy:", err);
                alert("Copy failed. Your browser may not support Clipboard API.");
                }
            }
        </script>
    </div>
{% endblock %}
