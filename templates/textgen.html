<!DOCTYPE html>
<html lang="en">
<head>
  <title>User Input Form</title>
  <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <style>
            * { box-sizing: border-box;

                /* If viewport width is 600px or more, set font-size to 80px */
                @media screen and (min-width: 600px) {
                #div1 { font-size: 80px;}
                }
                    /* Default (desktop/tablet) styles */
                form {
                    max-width: 400px;
                    margin: 50px auto;
                }
                #div1 {
                background-color: lightgrey;
                padding: 20px;
                font-size: 30px;
                }
            }

            #copybtn {
                padding: 12px 24px;
                font-size: 16px;
                background-color: #007BFF;
                color: white;
                border: none;
                border-radius: 4px;
                cursor: pointer;
            }


            /* Smartphone-specific styles (≤767px) */
            @media only screen and (max-width: 767px) {
                #copybtn {
                    width: 100%;           /* Full width for easier tapping */
                    padding: 16px 0;       /* Taller button for touch */
                    font-size: 18px;       /* Larger text for readability */
                }

                #div1 {
                background-color: lightgrey;
                padding: 20px;
                font-size: 30px;
                }
            }
        </style>
</head>
<body>
    <div id="div1" style="background: #9DF2E9;
                padding:5px;">
        <div id="textToCopy">{{ str_render }}</div>
        <button id="copybtn" onclick="copyText()">Copy</button><br>
        <!--REMEMBER TO CHANGE ID AND STYLING IN REFACTOR -->
        <button id="copybtn" style="padding:5px;"><a href="{{ url_for('textgen') }}">Start Over</a></button>

        <script>
            async function copyText() {
                try {
                const text = document.getElementById("textToCopy").textContent;

                // Write text to clipboard (modern API)
                await navigator.clipboard.writeText(text);

                } catch (err) {
                console.error("Failed to copy:", err);
                alert("Copy failed. Your browser may not support Clipboard API.");
                }
            }
        </script>
    </div>
</body>
</html>
