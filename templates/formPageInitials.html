<!DOCTYPE html>
<html lang="en">
	<head>
		<title>Coaches' coach</title>
		<meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <style>
            * { box-sizing: border-box;

                /* If viewport width is 600px or more, set font-size to 80px */
                @media screen and (min-width: 600px) {
                #div1 { font-size: 80px;}
                }
                    /* Default (desktop/tablet) styles */
                form {
                    max-width: 400px;
                    margin: 50px auto;
                }
                #div1 {
                background-color: lightgrey;
                padding: 20px;
                font-size: 30px;
                }
            }

            input[type="submit"] {
                padding: 12px 24px;
                font-size: 16px;
                background-color: #007BFF;
                color: white;
                border: none;
                border-radius: 4px;
                cursor: pointer;
            }

            input[type="submit"]:hover {
                background-color: #0056b3;
            }

            /* Smartphone-specific styles (≤767px) */
            @media only screen and (max-width: 767px) {
                input[type="submit"] {
                    width: 100%;           /* Full width for easier tapping */
                    padding: 16px 0;       /* Taller button for touch */
                    font-size: 18px;       /* Larger text for readability */
                }

                #div1 {
                background-color: lightgrey;
                padding: 20px;
                font-size: 30px;
                }
            }
        </style>
	</head>
	<body>
	    <div id="div1" style="background: #9DF2E9;
        padding:5px;">
    		<h3>You picked {{ data['site'] }} and {{  data['day']  }}</h3>
    		<p>Please choose initials:</p>
    		<form action="/submit-initials" method="POST">

    		    {% for attendee in attendees %}
    		    <input type="checkbox" id={{attendee}} name="initials" value={{attendee}}>
    		    <label for={{attendee}}>{{attendee}}</label><br>
    		    <!--<p>{{ attendee }}</p>-->
    		    {% endfor %}

                <input type="hidden" name="site" value="{{ data['site'] }}">
                <input type="hidden" name="day" value="{{ data['day'] }}">
                <input type="submit" value="Submit">
            </form>
        </div>
	</body>
</html>
