{% extends "admin_base.html" %}
{% block title %}Admin Portal{% endblock %}

{% block admin_content %}
{% if error %}
{{error}}
{% endif %}

<form id="addSkedForm" method="POST">
    {% for day in days %}
        <input type="checkbox" id="{{day[1]}}" name="day" value="{{day[1]}}">
        <label for="{{day[1]}}">{{ day[0] }}</label>
        <br />
    {% endfor %}

    <select name="initials" id="initials" form="addSkedForm">
        <option value="">--Please select a student to add--</option>
        {% for person in roster %}
            <option value="{{person}}">{{ person }}</option>
        {% endfor %}
    </select>
    <br />

    <button type="submit" formaction="{{ url_for('admin_add_sked', site=site)  }}">ZUBMIT</button>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
</form>

{% endblock %}
