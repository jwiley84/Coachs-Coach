<!DOCTYPE html>
<html lang="en">
	<head>
		<title>Coaches' coach</title>
	    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <style>
            * { box-sizing: border-box;

                /* If viewport width is 600px or more, set font-size to 80px */
                @media screen and (min-width: 600px) {
                #div1 { font-size: 80px;}
                }
                    /* Default (desktop/tablet) styles */
                form {
                    max-width: 400px;
                    margin: 50px auto;
                }
                #div1 {
                background-color: lightgrey;
                padding: 20px;
                font-size: 30px;
                }
            }

            input[type="submit"] {
                padding: 12px 24px;
                font-size: 16px;
                background-color: #007BFF;
                color: white;
                border: none;
                border-radius: 4px;
                cursor: pointer;
            }

            input[type="submit"]:hover {
                background-color: #0056b3;
            }

            /* Smartphone-specific styles (≤767px) */
            @media only screen and (max-width: 767px) {
                input[type="submit"] {
                    width: 100%;           /* Full width for easier tapping */
                    padding: 16px 0;       /* Taller button for touch */
                    font-size: 18px;       /* Larger text for readability */
                }

                #div1 {
                background-color: lightgrey;
                padding: 20px;
                font-size: 30px;
                }
            }
        </style>
	</head>
	<body>
	    <div id="div1" style="background: #9DF2E9;
                padding:5px;">
    		<h3>Hello, Job Coach!</h3>
    		<p>Please choose jobsite:</p>
    		<form action="/submit-site" method="POST">
                <input type="radio" id="tg" name="site" value="TG">
                <label for="tg">TG</label><br>
                <input type="radio" id="gh" name="site" value="GH">
                <label for="gh">Greenhouse</label><br>
                <input type="radio" id="mh" name="site" value="MH">
                <label for="mh">McLendon</label><br>
                <input type="radio" id="se" name="site" value="SE">
                <label for="se">Skyline</label><br>
                <input type="radio" id="le" name="site" value="LE">
                <label for="le">Lowell</label><br>
                <input type="submit" value="Submit">
            </form>
        </div>
	</body>
</html>
