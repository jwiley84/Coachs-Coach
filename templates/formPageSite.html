{% extends "base.html" %}

{% block title %} Site Selection {% endblock %}

{% block content %}
    <div class="card border-dark mb-3 mx-2 site-card">
        <div class="card-body">
            <h3 class="card-title">Please choose a jobsite</h3>
            <form action="{{ url_for('text_form') }}" method="POST">
                {% for name, shortcode in sites %}
                    <div class="form-check d-flex align-items-center">
                        <input class="form-check-input me-2" type="radio" id={{shortcode}} name="site" value={{name}}>
                        <label class="form-check-label fs-3" for={{shortcode}}>{{name}}</label>
                    </div>
                {% endfor %}
                <input type="submit" value="Submit" class="submit-button btn btn-lg w-100">
                <input type="hidden" name="step" value="site">
            </form>
        </div>
    </div>

{% endblock %}
