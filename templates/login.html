{% extends "base.html" %}

{% block content %}
{% if error %}
<div class="row">
    <div class="col-sm-4"></div>
    <div class="col-sm-4 error-card">
        {{error}}
    </div>
</div>
{% endif %}
<div class="row">
    <div class="col-sm-4"></div>
    <div class="col-sm-4">
        <div class="card border-dark mb-3 mx-2 login-card admin-card">
            <form method="POST" action="{{ url_for('user_login') }}" autocomplete="on">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
                <p></p>
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
                <button type="submit" class="btn btn-secondary site-btn">Login</button>
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            </form>
        </div>
    </div>
</div>

{% endblock %}
