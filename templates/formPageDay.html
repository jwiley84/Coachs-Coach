{% extends "base.html" %}

{% block title %} Day Selection {% endblock %}

{% block content %}
    <div class="card border-dark mb-3 mx-2 day-card">
        <div class="card-body">
            <h6 class="card-subtitle mb-3 text-muted">You picked {{ data['site'] }}</h6>
            <h3 class="card-title">Please choose day:</h3>
            <form action="{{ url_for('text_form') }}" method="POST">
               {% for label, value in days %}
					<div class="form-check d-flex align-items-center">
						<input class="form-check-input me-2" type="radio" id={{value}} name="day" value={{value}}>
						<label class="form-check-label fs-3" for={{value}}>{{label}}</label>
					</div>
				{% endfor %}
                <input type="hidden" name="site" value="{{ data['site'] }}">
                <input type="submit" value="Submit" class="submit-button btn btn-lg w-100 submit-btn">
                <input type="hidden" name="step" value="day">
            </form>
        </div>

    </div>
{% endblock %}
